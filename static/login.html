<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2547d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Downloader">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<title>Sign in · Downloader</title>
<style>
body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
  padding: calc(24px + var(--safe-top)) 16px calc(24px + var(--safe-bottom)); }
form { width: 100%; max-width: 360px; display: grid; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 52px; height: 52px; border-radius: 14px; }
h1 { font-size: 1.6rem; }
.sub { color: var(--muted); }
label { font-weight: 500; font-size: 14px; }
.field { display: grid; gap: 6px; }
input {
  width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-size: 17px;
}
.error { color: var(--err); font-size: 14px; min-height: 1.5em; }
.btn.primary { width: 100%; min-height: 50px; }
</style>
</head>
<body>
<form id="form" novalidate>
  <div class="brand">
    <img src="/icons/icon-192.png" alt="">
    <div>
      <h1>Downloader</h1>
      <p class="sub">Enter your password to continue.</p>
    </div>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  </div>
  <p class="error" id="error" role="alert"></p>
  <button class="btn primary" id="submit" type="submit">Sign in</button>
</form>
<script>
const form = document.getElementById("form");
const error = document.getElementById("error");
const submit = document.getElementById("submit");

function nextPath() {
  const next = new URLSearchParams(location.search).get("next") || "/";
  // Same rule as the server: only paths on this site.
  return next.startsWith("/") && !next.startsWith("//") && !next.includes("\\") ? next : "/";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = document.getElementById("password").value;
  if (!password) { error.textContent = "Type your password."; return; }
  submit.disabled = true;
  submit.innerHTML = '<span class="spinner"></span> Signing in';
  error.textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }), credentials: "same-origin",
    });
    if (r.ok) { location.replace(nextPath()); return; }
    const data = await r.json().catch(() => ({}));
    error.textContent = data.detail || "Couldn't sign in. Try again.";
  } catch {
    error.textContent = "No connection. Check your internet and try again.";
  }
  submit.disabled = false;
  submit.textContent = "Sign in";
});
</script>
</body>
</html>
