<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2547d0">
<title>Offline · Downloader</title>
<style>
:root{--bg:#eef1f6;--ink:#141a26;--muted:#586174;--accent:#2547d0;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e121a;--ink:#e6eaf2;--muted:#98a2b6;--accent:#7f9bff;--accent-ink:#0b1020;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
main{display:grid;gap:12px;justify-items:center;max-width:320px}
img{width:72px;height:72px;border-radius:18px}
h1{font-size:1.3rem;margin:0}p{margin:0;color:var(--muted)}
button{margin-top:8px;padding:12px 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 15px system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Downloader needs an internet connection. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
